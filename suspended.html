<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service Suspended</title>
<style>
  :root { color-scheme: dark; }
  html,body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center;
         background:#111; color:#eee; font-family:system-ui,Segoe UI,Arial,sans-serif; }
  .box { text-align:center; max-width:60ch; padding:2rem; }
  h1 { font-size:3rem; margin:0 0 1rem; color:#ff4d4d; }
  p { font-size:1.4rem; line-height:1.5; margin:.5rem 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>Service Suspended</h1>
    <p>This display has been suspended.</p>
    <p>Please contact KD Systems to restore service.</p>
  </div>
</body>
</html>
